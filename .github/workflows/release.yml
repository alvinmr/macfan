name: Release

# Conventional commits on main (feat:, fix:, …) make release-please open a release PR.
# Merging it tags vX.Y.Z, then this workflow builds, uploads and publishes the update.
# Run it manually with `release_tag` to rebuild an existing release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and upload (for example v0.1.0)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    env:
      TAG_NAME: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          test "$TAG_NAME" = "v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      # Optional: with an Apple Developer account, add MACOS_CERTIFICATE (base64 .p12),
      # MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD.
      # Releases are then signed with Developer ID and notarized: no Gatekeeper prompt.
      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "::notice title=Ad-hoc signed::No Developer ID certificate configured; users will see a Gatekeeper prompt."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build app (universal)
        env:
          UNIVERSAL: "1"
          MACFAN_VERSION: ${{ steps.version.outputs.version }}
          MACFAN_BUILD: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: scripts/build-app.sh

      - name: Build DMG
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: scripts/build-dmg.sh

      - name: Notarize
        if: steps.signing.outputs.identity != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh "build/MacFan-v${{ steps.version.outputs.version }}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: MacFan-macOS
          path: build/MacFan-v*-macOS.dmg*

      - name: Upload release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A version-less copy keeps the README's one-click download link stable.
          cp "build/MacFan-v${VERSION}-macOS.dmg" build/MacFan-macOS.dmg
          # The shipped binaries are stripped; these symbols turn crash reports back into file:line.
          ditto -c -k --keepParent build/dSYMs "build/MacFan-v${VERSION}-dSYMs.zip"
          gh release upload "$TAG_NAME" \
            "build/MacFan-v${VERSION}-macOS.dmg" \
            "build/MacFan-v${VERSION}-macOS.dmg.sha256" \
            build/MacFan-macOS.dmg \
            "build/MacFan-v${VERSION}-dSYMs.zip" \
            --clobber

      - name: Publish Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::warning title=Sparkle appcast skipped::Set the SPARKLE_PRIVATE_KEY secret to publish automatic updates."
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          mkdir -p updates
          cp "build/MacFan-v${VERSION}-macOS.dmg" updates/
          gh release view "$TAG_NAME" --json body --jq .body > "updates/MacFan-v${VERSION}-macOS.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases" \
            updates
          gh release upload "$TAG_NAME" updates/appcast.xml --clobber

      - name: Update Homebrew cask
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$TAP_GITHUB_TOKEN" ]]; then
            echo "::warning title=Homebrew cask not updated::Set the TAP_GITHUB_TOKEN secret to bump alvinmr/homebrew-tap automatically."
            exit 0
          fi
          SHA="$(awk '{print $1}' "build/MacFan-v${VERSION}-macOS.dmg.sha256")"
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/alvinmr/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/macfan.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/macfan.rb
          if git diff --quiet; then
            echo "Cask is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "Update MacFan to ${VERSION}"
          git push origin HEAD:main

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
